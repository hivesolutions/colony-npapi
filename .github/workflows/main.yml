name: Main Workflow
on:
  push:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  build-linux:
    name: Build Linux
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          2.7,
          3.5,
          3.6,
          3.7,
          3.8,
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          latest,
          rc
        ]
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fix archived Debian repositories
        run: |
          if [ -f /etc/apt/sources.list ]; then
            sed -i 's|deb.debian.org/debian|archive.debian.org/debian|g' /etc/apt/sources.list
            sed -i '/security.debian.org/d' /etc/apt/sources.list
            sed -i '/-updates/d' /etc/apt/sources.list
          fi

      - name: Install system dependencies
        run: apt-get update && apt-get install -y libcups2-dev

      - name: Add test printer
        run: |
          apt-get install -y --no-install-recommends cups-daemon cups-client
          echo "FileDevice Yes" >> /etc/cups/cups-files.conf
          mkdir -p /run/cups
          cupsd
          for _ in $(seq 1 30); do lpstat -r | grep -q "scheduler is running" && break; sleep 1; done
          lpadmin -p npcolony-test-custom -E -v file:///dev/null -P src/python/npcolony_py/test/custom.ppd
          lpadmin -p npcolony-test-raw -E -v file:///dev/null
          grep -v -e Custom -e VariablePaperSize -e MaxMedia -e HWMargins src/python/npcolony_py/test/custom.ppd > /tmp/fixed.ppd
          lpadmin -p npcolony-test-fixed -E -v file:///dev/null -P /tmp/fixed.ppd
          echo "NPCOLONY_TEST_CUSTOM=1" >> "$GITHUB_ENV"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest

      - name: Check formatting
        if: matrix.python-version == '3.14'
        run: |
          pip install black
          black . --check

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

  build-manylinux:
    name: Build manylinux
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: yum install -y cups-devel

      - name: Setup Python ${{ matrix.python-version }}
        run: python${{ matrix.python-version }} -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> "$GITHUB_PATH"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest build

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

      - name: Build wheel
        run: python -m build --wheel

      - name: Repair wheel
        run: auditwheel repair --exclude libcups.so.2 dist/*.whl

  build-manylinux-arm:
    name: Build manylinux ARM
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: ubuntu-26.04-arm
    container: quay.io/pypa/manylinux_2_28_aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: yum install -y cups-devel

      - name: Setup Python ${{ matrix.python-version }}
        run: python${{ matrix.python-version }} -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> "$GITHUB_PATH"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest build

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

      - name: Build wheel
        run: python -m build --wheel

      - name: Repair wheel
        run: auditwheel repair --exclude libcups.so.2 dist/*.whl

  build-windows:
    name: Build Windows
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          3.6,
          3.7,
          3.8,
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest build

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

      - name: Build wheel
        run: python -m build --wheel

  build-windows-arm:
    name: Build Windows ARM
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: windows-11-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest build

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

      - name: Build wheel
        run: python -m build --wheel

  build-windows-xp:
    name: Build Windows XP
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: [
          2.7.18,
          3.4.4
        ]
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        run: |
          Invoke-WebRequest https://www.python.org/ftp/python/${{ matrix.python-version }}/python-${{ matrix.python-version }}.msi -OutFile python.msi
          $process = Start-Process msiexec -Wait -PassThru -ArgumentList "/i python.msi /qn /norestart /l*v python.log ALLUSERS=1 TARGETDIR=C:\Python"
          if ($process.ExitCode -notin 0, 3010) { Get-Content python.log -Tail 100 -ErrorAction SilentlyContinue; throw "Failed to install python.msi ($($process.ExitCode))" }
          Add-Content $env:GITHUB_PATH "C:\Python", "C:\Python\Scripts"
          Add-Content $env:GITHUB_ENV "NPCOLONY_TEST_XP=1"

      - name: Setup MSVC 9.0
        if: matrix.python-version == '2.7.18'
        run: |
          Invoke-WebRequest "${{ vars.VCPYTHON27_URL || 'https://web.archive.org/web/20210106040222id_/https://download.microsoft.com/download/7/9/6/796EF2E4-801B-4FC4-AB28-B59FBF6D907B/VCForPython27.msi' }}" -OutFile vcpython27.msi
          if ((Get-FileHash vcpython27.msi).Hash -ne "070474db76a2e625513a5835df4595df9324d820f9cc97eab2a596dcbc2f5cbf") { (Get-Item vcpython27.msi).Length; Get-Content vcpython27.msi -TotalCount 20; throw "Invalid checksum for vcpython27.msi" }
          $process = Start-Process msiexec -Wait -PassThru -ArgumentList "/i vcpython27.msi /qn /norestart /l*v vcpython27.log ALLUSERS=1"
          if ($process.ExitCode -notin 0, 3010) { Get-Content vcpython27.log -Tail 100 -ErrorAction SilentlyContinue; throw "Failed to install vcpython27.msi ($($process.ExitCode))" }

      - name: Setup MSVC 10.0
        if: matrix.python-version == '3.4.4'
        run: |
          Invoke-WebRequest https://download.microsoft.com/download/F/1/0/F10113F5-B750-4969-A255-274341AC6BCE/GRMSDK_EN_DVD.iso -OutFile sdk.iso
          if ((Get-FileHash sdk.iso).Hash -ne "27cb38f76095c0acb9b558109f8693b39cbceb796856c15bd575f9e9d0b316c3") { throw "Invalid checksum for sdk.iso" }
          $drive = (Mount-DiskImage -ImagePath "$pwd\sdk.iso" -PassThru | Get-Volume).DriveLetter
          $process = Start-Process msiexec -Wait -PassThru -ArgumentList "/i ${drive}:\Setup\WinSDKBuild\WinSDKBuild_x86.msi /qn /norestart /l*v sdk.log"
          if ($process.ExitCode -notin 0, 3010) { Get-Content sdk.log -Tail 100 -ErrorAction SilentlyContinue; throw "Failed to install WinSDKBuild_x86.msi ($($process.ExitCode))" }
          $process = Start-Process msiexec -Wait -PassThru -ArgumentList "/i ${drive}:\Setup\vc_stdx86\vc_stdx86.msi /qn /norestart /l*v vc.log"
          if ($process.ExitCode -notin 0, 3010) { Get-Content vc.log -Tail 100 -ErrorAction SilentlyContinue; throw "Failed to install vc_stdx86.msi ($($process.ExitCode))" }

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<19.2"
          pip install --upgrade setuptools pytest wheel

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Diagnose printing
        run: |
          Get-Printer | Format-Table Name, DriverName, PortName -AutoSize
          Get-PrinterDriver | Format-Table Name, MajorVersion, PrinterEnvironment -AutoSize
          python -c "import npcolony; print([(device['name'], device['is_default']) for device in npcolony.get_devices()])"
          @'
          import os
          import sys
          import time
          import base64
          import struct
          import ctypes
          import npcolony
          printer = sys.argv[1]
          mode = sys.argv[2]
          path = os.path.abspath("diagnose-%s.out" % mode)
          start = time.time()
          def log(message):
              sys.stdout.write("%6.1fs %s %s: %s\n" % (time.time() - start, mode, printer, message))
              sys.stdout.flush()
          if mode == "npcolony":
              data = base64.b64encode(struct.pack("<256sIII", b"npcolony", 0, 0, 0)).decode("ascii")
              log("print_printer_base64")
              log(npcolony.print_printer_base64(printer, data, options=dict(output_path=path)))
          else:
              class DocInfo(ctypes.Structure):
                  _fields_ = [("size", ctypes.c_int), ("name", ctypes.c_wchar_p), ("output", ctypes.c_wchar_p), ("datatype", ctypes.c_wchar_p), ("type", ctypes.c_uint)]
              gdi32 = ctypes.WinDLL("gdi32")
              gdi32.CreateDCW.restype = ctypes.c_void_p
              gdi32.CreateDCW.argtypes = (ctypes.c_wchar_p,) * 3 + (ctypes.c_void_p,)
              gdi32.StartDocW.argtypes = (ctypes.c_void_p, ctypes.POINTER(DocInfo))
              for name in ("StartPage", "EndPage", "EndDoc", "DeleteDC"):
                  getattr(gdi32, name).argtypes = (ctypes.c_void_p,)
              log("CreateDCW")
              context = gdi32.CreateDCW(u"WINSPOOL", u"" + printer, None, None)
              log("context %r" % context)
              info = DocInfo(ctypes.sizeof(DocInfo), u"npcolony", u"" + path, None, 0)
              log("StartDocW %d" % gdi32.StartDocW(context, ctypes.byref(info)))
              log("StartPage %d" % gdi32.StartPage(context))
              log("EndPage %d" % gdi32.EndPage(context))
              log("EndDoc %d" % gdi32.EndDoc(context))
              log("DeleteDC %d" % gdi32.DeleteDC(context))
          log("exists %s" % os.path.exists(path))
          '@ | Set-Content diagnose.py
          foreach ($mode in "gdi", "npcolony") {
            foreach ($printer in "Microsoft Print to PDF", "Microsoft XPS Document Writer") {
              $process = Start-Process python -ArgumentList "diagnose.py", "`"$printer`"", $mode -NoNewWindow -PassThru
              if (-not $process.WaitForExit(90000)) {
                Write-Output "timeout: $mode $printer"
                Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table Id, ProcessName, MainWindowTitle -AutoSize
                Get-Process splwow64 -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, StartTime -AutoSize
                Stop-Process -Id $process.Id -Force
                Stop-Process -Name splwow64 -Force -ErrorAction SilentlyContinue
              }
            }
          }
          throw "Printing diagnosed"

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

      - name: Build wheel
        run: python setup.py bdist_wheel

  build-macos-arm:
    name: Build macOS ARM
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest build

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

      - name: Build wheel
        run: python -m build --wheel

  build-macos-intel:
    name: Build macOS Intel
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          3.5,
          3.6,
          3.7,
          3.8,
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
        env:
          PIP_TRUSTED_HOST: "pypi.python.org pypi.org files.pythonhosted.org"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test
