name: Main Workflow
on:
  push:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  build-linux:
    name: Build Linux
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          2.7,
          3.5,
          3.6,
          3.7,
          3.8,
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          latest,
          rc
        ]
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fix archived Debian repositories
        run: |
          if [ -f /etc/apt/sources.list ]; then
            sed -i 's|deb.debian.org/debian|archive.debian.org/debian|g' /etc/apt/sources.list
            sed -i '/security.debian.org/d' /etc/apt/sources.list
            sed -i '/-updates/d' /etc/apt/sources.list
          fi

      - name: Install system dependencies
        run: apt-get update && apt-get install -y libcups2-dev

      - name: Add test printer
        run: |
          apt-get install -y --no-install-recommends cups-daemon cups-client
          echo "FileDevice Yes" >> /etc/cups/cups-files.conf
          mkdir -p /run/cups
          cupsd
          for _ in $(seq 1 30); do lpstat -r | grep -q "scheduler is running" && break; sleep 1; done
          lpadmin -p npcolony-test-custom -E -v file:///dev/null -P src/python/npcolony_py/test/custom.ppd
          lpadmin -p npcolony-test-raw -E -v file:///dev/null
          grep -v -e Custom -e VariablePaperSize -e MaxMedia -e HWMargins src/python/npcolony_py/test/custom.ppd > /tmp/fixed.ppd
          lpadmin -p npcolony-test-fixed -E -v file:///dev/null -P /tmp/fixed.ppd
          echo "NPCOLONY_TEST_CUSTOM=1" >> "$GITHUB_ENV"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest

      - name: Check formatting
        if: matrix.python-version == '3.14'
        run: |
          pip install black
          black . --check

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

  build-manylinux:
    name: Build manylinux
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: yum install -y cups-devel

      - name: Setup Python ${{ matrix.python-version }}
        run: python${{ matrix.python-version }} -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> "$GITHUB_PATH"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest build

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

      - name: Build wheel
        run: python -m build --wheel

      - name: Repair wheel
        run: auditwheel repair --exclude libcups.so.2 dist/*.whl

  build-manylinux-arm:
    name: Build manylinux ARM
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: ubuntu-26.04-arm
    container: quay.io/pypa/manylinux_2_28_aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: yum install -y cups-devel

      - name: Setup Python ${{ matrix.python-version }}
        run: python${{ matrix.python-version }} -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> "$GITHUB_PATH"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest build

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

      - name: Build wheel
        run: python -m build --wheel

      - name: Repair wheel
        run: auditwheel repair --exclude libcups.so.2 dist/*.whl

  build-windows:
    name: Build Windows
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          3.6,
          3.7,
          3.8,
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest build

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

      - name: Build wheel
        run: python -m build --wheel

  build-windows-arm:
    name: Build Windows ARM
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: windows-11-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest build

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

      - name: Build wheel
        run: python -m build --wheel

  build-windows-xp:
    name: Build Windows XP
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          2.7.18,
          3.4.4
        ]
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        run: |
          Invoke-WebRequest https://www.python.org/ftp/python/${{ matrix.python-version }}/python-${{ matrix.python-version }}.msi -OutFile python.msi
          Start-Process msiexec -Wait -ArgumentList "/i python.msi /qn ALLUSERS=1 TARGETDIR=C:\Python"
          Add-Content $env:GITHUB_PATH "C:\Python", "C:\Python\Scripts"
          Add-Content $env:GITHUB_ENV "NPCOLONY_TEST_XP=1"

      - name: Setup MSVC 9.0
        if: matrix.python-version == '2.7.18'
        run: |
          Invoke-WebRequest "${{ vars.VCPYTHON27_URL }}" -OutFile vcpython27.msi
          if ((Get-FileHash vcpython27.msi).Hash -ne "070474db76a2e625513a5835df4595df9324d820f9cc97eab2a596dcbc2f5cbf") { throw "Invalid checksum for vcpython27.msi" }
          Start-Process msiexec -Wait -ArgumentList "/i vcpython27.msi /qn ALLUSERS=1"

      - name: Setup MSVC 10.0
        if: matrix.python-version == '3.4.4'
        run: |
          Invoke-WebRequest https://download.microsoft.com/download/F/1/0/F10113F5-B750-4969-A255-274341AC6BCE/GRMSDK_EN_DVD.iso -OutFile sdk.iso
          if ((Get-FileHash sdk.iso).Hash -ne "27cb38f76095c0acb9b558109f8693b39cbceb796856c15bd575f9e9d0b316c3") { throw "Invalid checksum for sdk.iso" }
          $drive = (Mount-DiskImage -ImagePath "$pwd\sdk.iso" -PassThru | Get-Volume).DriveLetter
          Start-Process msiexec -Wait -ArgumentList "/i ${drive}:\Setup\WinSDKBuild\WinSDKBuild_x86.msi /qn"
          Start-Process msiexec -Wait -ArgumentList "/i ${drive}:\Setup\vc_stdx86\vc_stdx86.msi /qn"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install "pip<19.2"
          pip install setuptools pytest wheel

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

      - name: Build wheel
        run: python setup.py bdist_wheel

  build-macos-arm:
    name: Build macOS ARM
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest build

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

      - name: Build wheel
        run: python -m build --wheel

  build-macos-intel:
    name: Build macOS Intel
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          3.5,
          3.6,
          3.7,
          3.8,
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
        env:
          PIP_TRUSTED_HOST: "pypi.python.org pypi.org files.pythonhosted.org"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install setuptools pytest

      - name: Build extension with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py build

      - name: Install package
        run: pip install .

      - name: Run tests
        run: pytest

      - name: Run tests with setup.py
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test
